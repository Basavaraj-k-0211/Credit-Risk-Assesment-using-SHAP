services:
  - type: web
    name: credit-risk-app
    runtime: python
    plan: free
    buildCommand: pip install -r static/requirements.txt
    startCommand: uvicorn main_cloude:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
